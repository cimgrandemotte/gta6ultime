# GTA VI — THE ULTIMATE GUIDE · WORKFLOW MASTER
# Unique reference for the whole build. Updated after every state.
# ════════════════════════════════════════════════════════════════
project:
  name: "GTA VI — The Ultimate Guide"
  slogan: "Leonida Awaits. Are You Ready?"
  root: "/home/user/gta6-ultimate-guide"
  language: "fr (principal) + en (secondary)"
  release_date: "2026-11-19"           # sortie officielle PS5 / Xbox Series X|S
  pc_release: "non annoncé (Q1 2027 rumeur rapportée oct. 2026)"
  author: "Arena.ai Agent — Autonomous Build"
  legal: "Fan guide non officiel — GTA VI © Rockstar Games / Take-Two Interactive"

constraints:
  images: "JPG uniquement · hyperréaliste/cinématographique · max 10 JPG par réponse"
  audio:  "MP3 uniquement · max 10 MP3 par réponse (synthèse vocale/ambiances — pas de musique licenciée)"
  forbidden: ["ZIP", "PDF", "PNG/WebP/AVIF pour images générées"]
  fact_integrity:
    - "Jeu prévu le 2026-11-19; l'embargo presse a été levé le 2026-11-18 : les informations observées en copie de test doivent être attribuées à la presse, et non présentées comme texte ou guide officiel Rockstar."
    - "Chaque fait doit être étiqueté : [CONFIRMÉ] (source officielle) · [FUITE] (leaks) · [COMMUNAUTÉ] · [ESTIMATION]."
    - "Aucune donnée inventée présentée comme officielle. Les prix/éditions viennent de Rockstar."

states:
  S0:
    name: INIT
    status: done
    actions:
      - Prompt analysé, infos de sortie vérifiées (19/11/2026, PS5 & Xbox Series X|S)
      - Arborescence complète créée
      - package.json, index.html racine (placeholder), robots.txt, sitemap.xml (squelette), manifest.json
    next: S1

  S1:
    name: RESEARCH
    status: done
    actions:
      - Recherches web FR+EN (presse, Rockstar, wikis, Reddit, GitHub, YouTube via articles)
      - research_data.json compilé (30+ sources datées, niveaux de confiance)
      - Faits clés: sortie 19/11, 99 Metacritic, 6★ wanted, Justin/Lucia confirmés, Online=2027 (non confirmé)
    next: S2

  S2:
    name: DESIGN_SYSTEM
    status: done
    actions:
      - design_system.css (tokens Vice City, néons, scanlines, tags de confiance éditoriale) ✓
      - components.css (navbar blur, recherche, cartes 3D, stat bars, audio player flottant, back-to-top anneau, ticker) ✓
      - animations.css + responsive.css ✓
      - JS : utils.js, components.js, animations.js, search.js, main.js (loading screen + curseur viseur) ✓
      - 10 images JPG héros/personnages ✓ (JPG uniquement, haute qualité)
      - 10 audios MP3 ORIGINAUX synthétisés (numpy+lameenc, 192 kbps) : ambiances Vice City/nature, 2 thèmes dark synthwave, SFX UI — aucun extrait licencié ✓
    next: S3

  S3:
    name: BUILD_CORE_PAGES
    status: done
    actions:
      - index.html complet : hero plein écran Vice City + particules d'or canvas + compte à rebours live (passe en 'DISPONIBLE MAINTENANT' après le 19/11 00:00)
      - Ticker actu réelle (Metacritic 99, déblocage NZ, 212 Go, online 2027)
      - Fiche technique + 6 compteurs animés (99 Metacritic, 6 régions, ×2, 170 espèces, ~80h, 8 nominations)
      - Sections : personnages, teaser carte 6 régions, stratégies day-one (recherche réelle), hub 12 sections, trailer officiel (Launch Trailer 8u_lV1LQr1Q)
      - Navbar + footer communs, composants flottants (audio, back-top, cookies)
      - Serveur local :8080 — assets vérifiés HTTP 200
    next: S4

  S4:
    name: BUILD_CONTENT_PAGES
    status: done
    batch_size: 3                      # pages par tour, puis demander CONTINUER
    completed_batches:
      - batch: 1
        pages: [pages/histoire/index.html, pages/histoire/synopsis.html, pages/histoire/missions.html]
        notes: "3 pages FR créées; 3 JPG héros originaux; synopsis adossé au texte Rockstar; liste missions créditée presse avec divergence de comptage 91/93 explicitée. HTTP 200 et JS syntax check OK."
      - batch: 2
        pages: [pages/personnages/jason.html, pages/personnages/lucia.html, pages/personnages/secondaires.html]
        notes: "3 pages FR créées; 3 JPG originaux (2 portraits 2:3, 1 visuel de groupe 16:9); biographies recoupées sur Only in Leonida; nomination Manni L. Perez vérifiée dans la page officielle TGA Best Performance (qui ne précise pas le personnage) et attribution à Lucia explicitement médiatique; switch characters sourcé entretien IGN/Rob Nelson; Reddit/GTAForums/YouTube/GitHub étiquetés comme communautaires. Tests HTTP 200, alt images présents, XML/JSON valides et JS syntax checks OK."
      - batch: 3
        pages: [pages/carte/index.html, pages/carte/vice-city.html, pages/carte/leonida-keys.html]
        notes: "3 pages FR; 3 JPG cinématiques 16:9; six régions officielles, détails des repères Vice City; distinctions CONFIRMÉ/OBSERVÉ/COMMUNAUTÉ/FUITE; leak social du poster 12/11 signalé sans republier l'image; carte Rockstar prévue en téléchargement gratuit le 19/11 selon annonce de lancement; atlas GitHub v0.8.2/3431 community records sourcé; QA HTTP 200, alt assets, JSON/sitemap valide, JS syntax OK."
      - batch: 4
        pages: [pages/carte/grassrivers.html, pages/carte/port-gellhorn.html, pages/carte/ambrosia.html]
        notes: "3 pages FR créées avec 3 JPG cinématiques; index carte et navigation mobile reliés aux nouvelles fiches; descriptions officielles séparées des captures promotionnelles, de la presse et des reconstructions de fans; Grassrivers (mangroves/alligators/airboats), Port Gellhorn (côte en déclin, Starlet Motel, Delights avec attribution prudente), Ambrosia (Allied Crystal et biker gang sans nom inventé); recherche GitHub/YouTube/Reddit/forums/X enregistrée; sitemap, recherche et ledger mis à jour; QA final: HTTP 200 sur hub, 3 pages et 3 JPG (1672×941), JSON/XML parse OK, search.js syntax OK, alt/SEO et références locales vérifiés."
      - batch: 5
        pages: [pages/carte/mount-kalaga.html, pages/armes/index.html, pages/armes/pistolets.html]
        notes: "3 pages FR; 3 nouveaux JPG 1672×941. Mount Kalaga établi depuis la description officielle; chasse/pêche/outdoor contextualisés par presse et critiques datées. Arsenal/pistolets bâtis sur les noms Rockstar (ES9, K17, Morgan), étiquettes d'interface (Moreland 850), captures officielles et observations de reviews publiées le 18/11; aucune tier list/stat inventée; screenshots X allégués review-backend explicitement classés FUITE et exclus comme preuve. Index de carte, CSS armory, recherche, sitemap et ledger mis à jour; QA final HTTP 200, JSON/XML, JS, références relatives, alt/SEO valides."
      - batch: 6
        pages: [pages/armes/fusils.html, pages/armes/explosifs.html, pages/armes/melee.html]
        notes: "3 guides français intégrés au hub armes, navigation de recherche et sitemap. Duke 556 et lance-grenades cadrés comme identifications/observations presse des médias Rockstar, sans inventaire ou statistiques prétendument officiels. Conseils pratiques attribués aux reviews du 18/11; mêlée précise l’avis critique divergent; discussions Reddit/GTAForums/YouTube/GitHub/X étiquetées communautaires ou non vérifiées. 2 JPG cinématiques générés pour fusils et mêlée; page explosifs réutilise l’image éditoriale armurerie existante après deux échecs de génération dédiés. QA final : HTTP 200 sur les trois pages via :8080; liens/assets locaux valides, images alt présents, JSON/XML valides, search.js syntaxe OK, métadonnées SEO et JPG 1672×941 vérifiés. La page explosifs réutilise le JPG éditorial existant après échec de génération dédiée. Batch 6 terminé."
      - batch: 7
        pages: [pages/vehicules/index.html, pages/vehicules/voitures.html, pages/vehicules/motos.html]
        notes: "3 pages FR véhicules avec 3 nouveaux JPG cinématiques 1672×941. Sources d’éditions Rockstar et Launch Gallery séparées des observations des tests GameSpot, IGN, TheSixthAxis, Shacknews et Forbes. Les conseils sont attribués aux reviews; avis moto contrastés explicités; identifications Reddit/GTAForums/YouTube/GitHub/X classées communautaires/secondaires. Hub, recherche et sitemap raccordés; QA final HTTP 200 sur les trois pages, liens/assets locaux et alt valides, JSON/XML et search.js validés, JPG confirmés 1672×941. Lot 7 terminé."
      - batch: 8
        pages: [pages/vehicules/bateaux.html, pages/vehicules/avions.html, pages/vehicules/helicopteres.html]
        notes: "3 fiches FR sur bateaux, avions et hélicoptères; sources Rockstar, reviews (IGN, Creative Bloq, Kotaku, NME), Reddit, GTAForums, YouTube, GitHub et X séparées par niveau de preuve. 3 JPG cinématiques immersifs 1672×941 générés pour la réponse. Hub véhicules, navigation mobile, recherche et sitemap raccordés. Conseils attribués aux reviewers, sans roster/stat inventés. QA final : HTTP 200 sur les trois nouvelles fiches; liens locaux/alt/SEO valides; JSON, XML et JS valides; trois JPG confirmés JPEG 1672×941. Lot 8 terminé."
      - batch: 9
        pages: [pages/gameplay/index.html, pages/gameplay/mecaniques.html, pages/gameplay/police.html]
        notes: "3 guides français Gameplay, Mécaniques et Police/Heat. Recherche du 18/11: footage officiel Rockstar, tests Press Start, NPR, RPGamer, TrueAchievements, GamingBoulevard (interviews Rockstar), Reddit, YouTube, GitHub et réseaux sociaux; UI et conseils de source secondaire restent attribués/qualifiés. 3 JPG photoréalistes cinématiques générés et vérifiés JPEG 1672×941. Navigation de recherche, sitemap et ledger ajoutés. QA final : HTTP 200 sur les trois pages; liens/assets locaux, alt, SEO et JSON-LD valides; JSON/XML, search.js syntax OK; entrées uniques. Lot 9 terminé."
      - batch: 10
        pages: [pages/collectibles/index.html, pages/guide/astuces.html, pages/guide/100-pour-cent.html]
        notes: >-
          Guides français basés sur les reviews de lancement Digital Spy et Polygon; observations de collecte et scans explicitement attribuées, sans inventer total, pins ou images d’objet. Capture JPG Digital Spy/Rockstar d’un SeaHawk ajoutée avec crédit à la fiche nautique. Sitemap, recherche, ledger et liens vers cartes communautaires actualisés. QA : liens locaux et alt valides, pages HTTP 200, JPG presse 1920×1080; JS, JSON, XML valides; unicité 44/44.
      - batch: 11
        pages: [pages/news/index.html, pages/online/index.html, pages/soundtrack/index.html, pages/editions/index.html, pages/quiz/index.html, pages/guide/cheats.html]
        notes: >-
          Six cibles de navigation auparavant manquantes créées : News, statut Online, musique, éditions, quiz interactif accessible de 8 questions et page de cheats. Rockstar re-vérifié le 18/11 : six aperçus radio, album de 34 titres, score Justice (30 pistes; 11 décembre), expérience solo, préchargement et bonus d’édition. Au lot 12, les guides de triche sont actualisés à 61 codes rapportés après l’histoire, avec conditions et désactivation des sauvegardes/trophées selon GameSpot/PowerPyx. Un prix PS Store régional est daté plutôt que présenté comme universel. PR GitHub communautaire/non officiel; Reddit/YouTube n’ont pas apporté de guide d’objets corroboré. Sitemap, ledger et tests de liens réalisés.
      - batch: 12
        pages: [pages/gameplay/economie.html, pages/gameplay/combat.html, pages/gameplay/conduite.html]
        notes: >-
          Trois guides spécialisés fondés sur les conseils et reviews retail de GameSpot, TheSixthAxis et Forbes. Économie : niveaux de sécurité, brouilleur de billets teints au chapitre 3, codes de coffre aléatoires, receleurs et risque des sacs. Combat : Focus, réglages, couverture, silencieux, gestion d’armes. Conduite : Waink, alarmes/trackers, enregistrement, classes de véhicules et transports. La vidéo YouTube de conseils pré-lancement est classée piste secondaire seulement. Trois illustrations cinématiques uniques générées en JPG 1672×941, indiquées comme artwork IA et non comme captures de jeu. Hub gameplay, recherche, sitemap et ledger raccordés; page 100 % et cheats actualisées selon PowerPyx/GameSpot avec divergences et incertitudes notées. QA final : liens du site sans cible locale manquante, nouvelles pages HTTP 200, JS de recherche et du quiz, JSON/XML/YAML valides; audit images 48/48 JPEG locales uniques.
      - batch: 13
        pages: [pages/guide/trophees.html, pages/histoire/fins.html, pages/secrets/easter-eggs.html, pages/guide/astuces.html, pages/collectibles/index.html, pages/news/index.html]
        notes: >-
          Lot 13 QA/intégration : les trois pages Trophées, Fins et Easter eggs étaient déjà présentes et leurs entrées sitemap/recherche sont vérifiées. Enrichissement des astuces par guides VGC, GameSpot et Kotaku, avec attribution explicite; intégration des seuils/cartes PowerPyx en distinguant données tierces et fiche locale encore incomplète; correction de la lecture du lancement roulant via support Rockstar + PlayStation. Nouvelle illustration éditoriale haute qualité en JPG uniquement, non présentée comme capture. Research ledger et mots-clés recherche mis à jour. QA finale réussie : liens/assets locaux, alt, HTML parsé, sitemap XML (44 URL), JSON, YAML, JS recherche; 48 images JPEG locales uniques.
      - batch: 14
        pages: [pages/guide/100-pour-cent.html, pages/quiz/index.html, pages/guide/astuces.html, pages/news/index.html, index.html]
        notes: >-
          Implémentations locales terminées : suivi 100% dans localStorage (quotas PowerPyx explicitement tiers, tâches libres, export JSON, reset), quiz étendu à 30 questions (sources par réponse, timer, meilleur score local). Astuces mises à jour sur les marqueurs sablier et le journal de missions d’après PowerPyx; News ajoute le dépannage PS5 officiel, tout en distinguant les rapports de version firmware, Reddit et GTAForums. Les retours de changement de région Xbox restent anecdotiques et ne sont pas donnés en procédure. Nouvelles recherches YouTube = streams de lancement uniquement, aucune mécanique établie à partir d’eux; GitHub PR cartographique décrit ses propres critères et reste communautaire. Carte filtrable et base armes/véhicules restent au backlog S5. QA : 30 questions, JS des fonctionnalités parsé, pages HTTP 200, JSON/XML/YAML et recherche valides; 48 images JPG uniques, aucune image/audio généré pour ce lot.
      - batch: 15
        pages: [pages/guide/index.html, pages/guide/debutants.html, pages/online/modes.html]
        notes: >-
          Création du hub de guides, d’un guide premières heures sans spoilers d’intrigue et d’une fiche modes/Online. Recherche du 18/11 sur VGC, Kotaku, TechRadar, TheSixthAxis, Rockstar Newswire, YouTube et Reddit; conseils précis (cache sous le plancher, carte intérieure, Dolores, mécanicien, Focus, coffre/WAiNK) étiquetés comme observations de presse. GTA VI décrit comme solo par Rockstar; aucune date ou fonction Online n’est inventée. Recherche, navigation homepage, cross-links et sitemap raccordés. Aucun nouvel asset image/audio généré; 53 JPG locaux uniques conservés. QA réussie : 47 pages HTTP 200, sitemap 47 URL, recherche 47/47 avec cibles valides, liens et fragments internes OK, JSON/YAML/XML/JS valides.
