    name: INTERACTIVE_FEATURES
    status: done
    actions:
      - "Checklist 100% ajoutée : tracker navigateur local, quotas tiers attribués, tâches libres, export JSON et reset."
      - "Quiz étendu à 30 questions sourcées, chronomètre, meilleur score local et lien de preuve par réponse."
      - "Astuces et News actualisées par recherche lancement : missions à sablier (PowerPyx), dépannage PS5 officiel, témoignages Reddit/GTAForums et PR GitHub étiquetés selon preuve."
