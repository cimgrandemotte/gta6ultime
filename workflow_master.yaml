    status: in_progress
    actions:
      - README.md et configs statiques GitHub Pages / Netlify / Vercel ajoutés; scripts audit et configuration origin ajoutés. GitHub Pages est le fournisseur choisi; le workflow récupère automatiquement l’URL. Le déploiement est bloqué tant que l’audit ne passe pas, car les pages légales attendent encore l’identité et le contact publics réels de l’éditeur. Les visuels sourcés ont tous été retirés; les 53 images référencées sont des JPG générés.
