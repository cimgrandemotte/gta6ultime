name: Publish static guide to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Set production origin from GitHub Pages
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/set_site_origin.py "$PAGES_BASE_URL" --apply
      - name: Validate static site
        run: |
          python3 scripts/prepublish_audit.py
          for f in assets/js/*.js; do node --check "$f"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
